name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Test, Lint & Build Debug/Release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_ROOT" ]; then
            mkdir -p "$SDK_ROOT/licenses"
            for f in "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager; do
              if [ -x "$f" ]; then
                yes | "$f" --licenses >/dev/null 2>&1 || true
                break
              fi
            done
          fi

      - name: Prepare environment & debug keystore
        shell: bash
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

          if [ -f debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore || true
          fi

          if [ ! -s debug.keystore ]; then
            rm -f debug.keystore
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare release signing configuration
        shell: bash
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SECRET_KEYSTORE_B64" ] && [ -n "$SECRET_STORE_PASS" ] && [ -n "$SECRET_KEY_PASS" ]; then
            KEYSTORE_FILE="$RUNNER_TEMP/release-upload.jks"
            printf '%s' "$SECRET_KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SECRET_STORE_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASS" >> "$GITHUB_ENV"
            echo "APK_RELEASE_LABEL=release-signed" >> "$GITHUB_ENV"
          else
            echo "::notice::RELEASE_KEYSTORE_BASE64/STORE_PASSWORD/KEY_PASSWORD secrets not set; generating ephemeral CI keystore for release APK verification."
            KEYSTORE_FILE="$RUNNER_TEMP/ci-temp-upload.jks"
            EPHEMERAL_PASS="$(openssl rand -hex 16)"
            echo "::add-mask::$EPHEMERAL_PASS"
            rm -f "$KEYSTORE_FILE"
            keytool -genkeypair -noprompt \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$EPHEMERAL_PASS" \
              -alias upload \
              -keypass "$EPHEMERAL_PASS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 365 \
              -dname "CN=CI Build,O=ThemeStudio,C=US"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$EPHEMERAL_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$EPHEMERAL_PASS" >> "$GITHUB_ENV"
            echo "APK_RELEASE_LABEL=release-ci-signed" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests and Android Lint
        run: gradle :app:testDebugUnitTest :app:lintDebug --no-daemon --max-workers=2

      - name: Build Debug & Release APKs
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon --max-workers=2

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ env.APK_RELEASE_LABEL }}-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
